# ========== 选择记录 ==========
profile:
  store-selected: true # 重启后恢复策略组和手动节点的选择

# ========== DNS 设置 ==========
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip # 开启 Fake-IP，消除首包解析延迟，秒开网页
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.localdomain"
    - "*.example"
    - "*.invalid"
    - "*.localhost"
    - "*.test"
    - "*.local"
    - "*.home.arpa"
    - "time.*.com"
    - "ntp.*.com"
    - "*.ntp.org.cn"
    - "+.pool.ntp.org"
    - "stun.*"
    - "*.market.xiaomi.com" # 米家与智能家居直连
    - "*.delivery.mp.microsoft.com" # 微软/Xbox 下载 CDN 直连不走 Fake-IP
    - "*.windowsupdate.com"
  nameserver:
    - https://223.5.5.5/dns-query
    - https://1.1.1.1/dns-query
  fallback:
    - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN

# ========== 策略组 ==========
proxy-groups:
  # 主代理组
  - name: "PROXY"
    type: select
    proxies:
      - "AUTO"
      - "HK-AUTO"
      - "SG-AUTO"
      - "JP-AUTO"
      - "US-AUTO"
      - "TW-AUTO"
      - "MANUAL"
      - DIRECT
    icon: https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/adjust.svg

  # 谷歌服务
  - name: "Google"
    type: select
    proxies:
      - "AUTO"
      - "HK-AUTO"
      - "SG-AUTO"
      - "JP-AUTO"
      - "US-AUTO"
      - "TW-AUTO"
      - "MANUAL"
    icon: https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/google.svg

  # AI 服务（默认推荐首选 SG/US，避开香港地区封禁限制）
  - name: "AI"
    type: select
    proxies:
      - "SG-AUTO"
      - "US-AUTO"
      - "JP-AUTO"
      - "TW-AUTO"
      - "AUTO"
      - "MANUAL"
    icon: https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/chatgpt.svg

  # Telegram 专属服务（独立长连接，避免主节点测速漂移导致频繁重连）
  - name: "Telegram"
    type: select
    proxies:
      - "SG-AUTO"
      - "HK-AUTO"
      - "JP-AUTO"
      - "US-AUTO"
      - "AUTO"
      - "PROXY"
      - "MANUAL"
    icon: https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/telegram.svg

  # 🇭🇰 香港自动测速
  - name: "HK-AUTO"
    type: url-test
    proxies: [] # 脚本自动填充香港节点
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    icon: https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/flags/hk.svg

  # 🇸🇬 新加坡自动测速
  - name: "SG-AUTO"
    type: url-test
    proxies: [] # 脚本自动填充新加坡节点
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    icon: https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/flags/sg.svg

  # 🇯🇵 日本自动测速
  - name: "JP-AUTO"
    type: url-test
    proxies: [] # 脚本自动填充日本节点
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    icon: https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/flags/jp.svg

  # 🇺🇸 美国自动测速
  - name: "US-AUTO"
    type: url-test
    proxies: [] # 脚本自动填充美国节点
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    icon: https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/flags/us.svg

  # 🇹🇼 台湾自动测速
  - name: "TW-AUTO"
    type: url-test
    proxies: [] # 脚本自动填充台湾节点
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    icon: https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/flags/tw.svg

  # 全局手动选择：包含所有实际节点，不跟随自动测速切换
  - name: "MANUAL"
    type: select
    proxies: [] # 留空，由脚本动态填充全部节点
    icon: https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/adjust.svg

  # 全局自动测速：包含所有实际节点
  - name: "AUTO"
    type: url-test
    proxies: [] # 留空，由脚本动态填充全部节点
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50 # 节点切换容差（ms），减少小幅延迟波动造成的切换
    icon: https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/balance.svg

# ========== 第三方规则集定义 ==========
rule-providers:
  reject:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt"
    path: ./ruleset/reject.yaml
    interval: 86400

  icloud:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/icloud.txt"
    path: ./ruleset/icloud.yaml
    interval: 86400

  apple:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/apple.txt"
    path: ./ruleset/apple.yaml
    interval: 86400

  google:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/google.txt"
    path: ./ruleset/google.yaml
    interval: 86400

  proxy:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt"
    path: ./ruleset/proxy.yaml
    interval: 86400

  direct:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt"
    path: ./ruleset/direct.yaml
    interval: 86400

  private:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt"
    path: ./ruleset/private.yaml
    interval: 86400

  telegramcidr:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/telegramcidr.txt"
    path: ./ruleset/telegramcidr.yaml
    interval: 86400

  cncidr:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt"
    path: ./ruleset/cncidr.yaml
    interval: 86400

  lancidr:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt"
    path: ./ruleset/lancidr.yaml
    interval: 86400

  applications:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/applications.txt"
    path: ./ruleset/applications.yaml
    interval: 86400

# ========== 分流规则 ==========
rules:
  # 局域网和管理面板优先直连；IP 规则不主动触发 DNS 解析
  - RULE-SET,private,DIRECT
  - RULE-SET,lancidr,DIRECT,no-resolve
  - GEOIP,LAN,DIRECT,no-resolve
  - DOMAIN,clash.razord.top,DIRECT
  - DOMAIN,yacd.haishan.me,DIRECT

  # 微软与 Xbox 游戏大文件下载直连（跑满本地千兆宽带，不耗代理流量）
  - DOMAIN-SUFFIX,delivery.mp.microsoft.com,DIRECT
  - DOMAIN-SUFFIX,dl.delivery.mp.microsoft.com,DIRECT
  - DOMAIN-SUFFIX,windowsupdate.com,DIRECT
  - DOMAIN-SUFFIX,update.microsoft.com,DIRECT
  - DOMAIN,download.microsoft.com,DIRECT

  # AI 专用规则必须放在通用 Google 规则之前（规则自上而下首次命中）
  # OpenAI / ChatGPT / Sora：后缀规则同时覆盖主域名和资源子域名
  - PROCESS-NAME,com.openai.chatgpt,AI
  - DOMAIN-SUFFIX,openai.com,AI
  - DOMAIN-SUFFIX,chatgpt.com,AI
  - DOMAIN-SUFFIX,oaistatic.com,AI
  - DOMAIN-SUFFIX,oaiusercontent.com,AI
  - DOMAIN-SUFFIX,sora.com,AI
