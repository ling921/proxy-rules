name: Gist Sync
on:
  push:
    branches:
      - "master"
    paths:
      - "clash-config.yml"

jobs:
  sync-gist:
    runs-on: ubuntu-latest
    env:
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      GIST_ID: ${{ secrets.GIST_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Detect changed rule files
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            clash-config:
              - added|modified: 'clash-config.yml'

      - name: Update clash config gist file
        if: steps.changes.outputs.clash-config == 'true'
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ env.GIST_TOKEN }}
          gist_id: ${{ env.GIST_ID }}
          file_path: clash-config.yml
          gist_file_name: clash-config.yml
