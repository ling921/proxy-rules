name: Gist Sync
on:
  push:
    branches:
      - "master"
    paths:
      - "rules/*.txt"

jobs:
  sync-gists:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Sync via gh api
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          files=$(jq -n '{files:{}}')
          for f in rules/*.txt; do
            content=$(jq -Rs '.' "$f")
            files=$(jq --arg fn "$(basename "$f")" --argjson data "{\"content\":$content}" '.files[$fn]=$data | {files:.files}' <<<"$files")
          done
          echo "$files" | gh api -X PATCH /gists/$GIST_ID -H "Accept: application/vnd.github+json" -f files=-
