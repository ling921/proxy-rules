name: Gist Sync
on:
  push:
    branches:
      - "master"
    paths:
      - "rules/*.txt"

jobs:
  sync-gist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Authenticate gh
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}  # must have gist scope
        run: |
          printf '%s' "$GH_TOKEN" | gh auth login --with-token --hostname github.com
          gh auth status

      - name: Update gist files
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          set -euo pipefail
          for file in rules/*.txt; do
            remote="$(basename "$file")"
            if gh gist view "$GIST_ID" --files | grep -q "^$remote$"; then
              gh gist edit "$GIST_ID" --filename "$remote" <"$file"
            else
              gh gist edit "$GIST_ID" --add "$file" --filename "$remote"
            fi
          done
