name: Gist Sync
on:
  push:
    branches:
      - "master"
    paths:
      - "rules/*.txt"

jobs:
  sync-gist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Authenticate gh explicitly
        env:
          RAW_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          unset GH_TOKEN
          printf '%s' "$RAW_TOKEN" | gh auth login --with-token --hostname github.com

      - name: Verify gh auth
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}   # gist scope only
        run: gh auth status

      - name: Update gist files
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          set -euo pipefail
          for file in rules/*.txt; do
            remote="$(basename "$file")"
            if gh gist view "$GIST_ID" --files | grep -q "^$remote$"; then
              gh gist edit "$GIST_ID" --filename "$remote" <"$file"
            else
              gh gist edit "$GIST_ID" --add "$file" --filename "$remote"
            fi
          done
